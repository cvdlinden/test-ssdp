name: Node.js Unit Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Run Native Test Suite
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Set up Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Native Node.js Test Runner
        run: npm test
